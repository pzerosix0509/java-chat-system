name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK 21 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run unit tests
        run: ./mvnw -B -ntp clean verify
      - name: Check public client configuration
        run: ./mvnw -B -ntp -Pconfig-check exec:java
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64
      - name: Start Admin and User with real JavaFX
        if: runner.os == 'Linux'
        run: xvfb-run -a ./mvnw -B -ntp -Pui-smoke -Dtest=JavaFxBootstrapTest test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: warn

  postgres-config:
    name: External config / PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: core01
          POSTGRES_PASSWORD: core01-ci-only
          POSTGRES_DB: core01_a
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U core01 -d core01_a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHATAPP_DB_USERNAME: core01
      CHATAPP_DB_PASSWORD: core01-ci-only
      PG_PORT: ${{ job.services.postgres.ports[5432] }}
      PG_CONTAINER: ${{ job.services.postgres.id }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Create second real database and external files
        run: |
          docker exec "$PG_CONTAINER" psql -U core01 -d core01_a -c 'CREATE DATABASE core01_b'
          python3 - <<'PY'
          import os
          from pathlib import Path
          directory = Path(os.environ["RUNNER_TEMP"])
          for database, port in [("core01_a", 9101), ("core01_b", 9102), ("missing_core01", 9103)]:
              (directory / f"{database}.properties").write_text(
                  f"db.url=jdbc:postgresql://127.0.0.1:{os.environ['PG_PORT']}/{database}\n"
                  f"server.port={port}\n", encoding="utf-8")
          PY
      - name: Verify first external URL and server bootstrap
        run: |
          ./mvnw -B -ntp -Pconfig-check "-Dapp.config=$RUNNER_TEMP/core01_a.properties" "-Dexec.args=--connect-db" compile exec:java
          ./mvnw -B -ntp -Pserver "-Dapp.config=$RUNNER_TEMP/core01_a.properties" exec:java
      - name: Verify second URL without code changes or rebuilding
        run: ./mvnw -B -ntp -Pconfig-check "-Dapp.config=$RUNNER_TEMP/core01_b.properties" "-Dexec.args=--connect-db" exec:java
      - name: Missing database must fail
        run: |
          if ./mvnw -B -ntp -Pconfig-check "-Dapp.config=$RUNNER_TEMP/missing_core01.properties" "-Dexec.args=--connect-db" exec:java; then
            echo "Expected the nonexistent database to fail"
            exit 1
          fi
