# Copy to server.local.properties (gitignored) and supply credentials privately.
# Run with -Dapp.config=release/server.local.properties, or CHATAPP_CONFIG.
server.host=localhost
server.port=8888
db.url=jdbc:postgresql://localhost:5432/chat_app_db
db.username=chat_app
# Set CHATAPP_DB_PASSWORD in the server environment, or fill in the local file.
db.password=
db.driver=org.postgresql.Driver
db.pool.maximumPoolSize=10

mail.enabled=false
mail.smtp.host=
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.username=
mail.password=

llm.enabled=false
llm.provider=
llm.api.base.url=
llm.model=
llm.api.key=
llm.timeout.seconds=15
