# Cau hinh mac dinh (dong goi trong jar). Override bang release/config.properties.

# --- Database (MySQL 8) ---
db.url=jdbc:mysql://localhost:3306/chat_app_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
db.username=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver
db.pool.maximumPoolSize=10

# --- Chat server (Socket TCP) ---
server.host=localhost
server.port=8888
server.heartbeat.seconds=30
server.presence.timeout.seconds=120

# --- Email (reset password) ---
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.username=
mail.password=

# --- LLM (goi y / chinh sua tin nhan) ---
llm.provider=openai
llm.api.key=
llm.api.base.url=
llm.model=gpt-4o-mini
llm.timeout.seconds=15

# --- Bao mat ---
security.password.algorithm=bcrypt
security.group.crypto=aes-256-gcm

# --- Giao dien ---
app.language=vi
app.theme=light
