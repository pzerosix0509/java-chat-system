# UTF-8 defaults. External files overlay these values; never store real secrets here.
# PostgreSQL 17; the server requires DB credentials, clients do not.
db.url=jdbc:postgresql://localhost:5432/chat_app_db
db.username=
db.password=
db.driver=org.postgresql.Driver
db.pool.maximumPoolSize=10

server.host=localhost
server.port=8888
server.heartbeat.seconds=30
server.presence.timeout.seconds=120

# Optional integrations are enabled explicitly on the server.
mail.enabled=false
mail.smtp.host=
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.username=
mail.password=

llm.enabled=false
llm.provider=
llm.api.base.url=
llm.model=
llm.api.key=
llm.timeout.seconds=15

security.password.algorithm=argon2id
security.group.crypto=aes-256-gcm
app.language=vi
app.theme=light
